<script>
const el = id => document.getElementById(id);
const rows = JSON.parse(el('data').textContent);
const dates = rows.map(([date]) => date).sort();
const height = el('height'), from = el('from'), to = el('to');
for (const value of [...new Set(rows.map(row => row[2]))].sort((a,b) => a-b)) {
  height.add(new Option(value + ' m', value));
}
for (const input of [from, to]) {
  input.min = dates[0];
  input.max = dates.at(-1);
}
from.value = from.min;
to.value = to.max;

function summarize(rows, height, from, to) {
  const groups = new Map();
  for (const [date, roof, level, speed] of rows) {
    if ((height && level !== Number(height)) || (from && date < from) || (to && date > to)) continue;
    const group = groups.get(roof) ?? {roof, total:0, count:0};
    group.total += speed;
    group.count++;
    groups.set(roof, group);
  }
  return [...groups.values()].map(g => ({...g, mean:g.total/g.count}))
    .sort((a,b) => b.mean-a.mean || a.roof.localeCompare(b.roof,'ko'));
}

function render() {
  const groups = summarize(rows, height.value, from.value, to.value);
  const chart = el('chart');
  chart.replaceChildren();
  el('scale').hidden = !groups.length;
  const top = groups[0];
  if (!top) {
    el('result').textContent = '선택한 조건에 풍속 데이터가 없어요';
    return;
  }
  const best = groups.filter(g => Math.abs(g.mean-top.mean)<1e-9).map(g => g.roof).join(', ');
  el('result').textContent = '평균 풍속이 가장 높은 곳은 ' + best + ', 평균 ' + top.mean.toFixed(2) + ' m/s';
  const limit = Math.max(1, Math.ceil(top.mean));
  el('axisEnd').textContent = limit + ' m/s';
  for (const {roof,mean,count} of groups) {
    const item = document.createElement('li');
    const label = document.createElement('strong');
    label.textContent = roof + ' · ' + mean.toFixed(2) + ' m/s (' + count + '건)';
    const track = document.createElement('div');
    track.className = 'track';
    track.setAttribute('aria-hidden','true');
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.width = 100*mean/limit + '%';
    track.append(bar);
    item.append(label,track);
    chart.append(item);
  }
}

for (const control of [height,from,to]) control.addEventListener('input',render);
render();
</script>
